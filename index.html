<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0f4c5c"><title>Dashboards BI — RH, Comercial, Visão Geral e Varejo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<style>
:root{--bg:#eaf4f4;--card:#fff;--text:#0f2a30;--mut:#52707a;--ac:#0f4c5c;--ac2:#52b788;--kv:#0f4c5c;--head:#0f4c5c}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;transition:background .25s}
#top{background:var(--head)}
.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid color-mix(in srgb,var(--mut) 30%,transparent);box-shadow:0 2px 10px #0002}
.kpi{border-left:6px solid var(--ac2)}
.kpi small{color:var(--mut);font-size:12px;font-weight:600}
.kpi b{display:block;color:var(--kv);font-size:clamp(18px,2.2vw,26px);margin-top:2px}
h3{font-weight:700;margin-bottom:8px;font-size:15px}
.chip{padding:4px 12px;border-radius:999px;border:1px solid var(--mut);font-size:13px;cursor:pointer;background:transparent;color:var(--text)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;font-weight:700;font-size:14px;color:#fff;background:#ffffff22;white-space:nowrap}
.tab.on{background:#fff;color:#111}
.btn{font-weight:800;border-radius:10px;padding:10px 16px;font-size:14px;color:#fff;cursor:pointer;transition:background .2s}
.b1{background:#16a34a;font-size:16px;padding:12px 22px;box-shadow:0 3px 0 #166534}
.b1:hover{background:#15803d}
.b2{background:#2563eb}.b3{background:#475569}
.btn.done{background:#f59e0b!important;color:#111;box-shadow:0 3px 0 #b45309}
.tw{max-height:520px;overflow:auto;border-radius:10px;border:1px solid color-mix(in srgb,var(--mut) 30%,transparent)}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card)}
thead th{position:sticky;top:0;background:var(--ac);color:#fff;padding:8px;text-align:left;white-space:nowrap;z-index:1}
td{padding:4px 8px;border-bottom:1px solid color-mix(in srgb,var(--mut) 25%,transparent);white-space:nowrap}
td.calc{background:color-mix(in srgb,var(--ac) 12%,transparent);font-weight:600}
td[contenteditable]:focus{outline:2px solid var(--ac2);background:color-mix(in srgb,var(--ac2) 18%,transparent)}
</style>
</head>
<body>
<header id="top" class="fixed top-0 inset-x-0 z-50 px-3 pt-2 shadow-lg">
  <div id="tabs" class="flex gap-1 overflow-x-auto"></div>
  <div class="flex flex-wrap gap-2 py-2 bg-transparent">
    <button class="btn b1 bcopy" data-a="cur">COPIAR PLANILHA ATUAL (EXCEL/SHEETS)</button>
    <button class="btn b2" data-a="all" id="ball">COPIAR TODAS AS 4 PLANILHAS</button>
    <button class="btn b3" data-a="csv">BAIXAR CSV</button>
  </div>
</header>
<main id="app" class="px-3 pb-10 max-w-[1500px] mx-auto">
  <h1 id="ttl" class="text-2xl font-extrabold mb-3"></h1>
  <div id="flt" class="card mb-3 flex flex-wrap gap-x-6 gap-y-2"></div>
  <div id="kpi" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mb-3"></div>
  <div id="ch" class="grid grid-cols-1 lg:grid-cols-3 gap-3 mb-4"></div>
  <div class="flex flex-wrap items-center gap-3 mb-2">
    <h2 class="font-bold text-lg">Base de dados (clique numa célula para editar)</h2>
    <button class="btn b1 bcopy" data-a="cur">COPIAR PLANILHA ATUAL (EXCEL/SHEETS)</button>
    <button class="btn b2" data-act="add">+ Adicionar linha</button>
    <button class="btn b3" data-act="clr">Limpar tabela</button>
    <button class="btn b3" data-act="rst">Restaurar originais</button>
  </div>
  <div class="tw"><table id="tb"></table></div>
</main>

  save();drawDash();drawTable();if(k==='add'){const l=$('#tb tbody').lastElementChild;if(l)l.scrollIntoView({block:'center'})}return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,t=T[cur];
 if(a==='cur'){copy(tsv(t));flash('.bcopy','COPIADO! COLE NO EXCEL (CTRL+V)')}
 if(a==='all'){copy(T.map(k=>'=== '+k.name+' ===\n'+tsv(k)).join('\n\n'));flash('#ball','COPIADO! 4 PLANILHAS (CTRL+V)')}
 if(a==='csv'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv(t)],{type:'text/csv;charset=utf-8'}));l.download=t.name.replace(/[^\w]+/g,'_')+'.csv';l.click();URL.revokeObjectURL(l.href)}
});
$('#tb').addEventListener('input',e=>{const td=e.target.closest('td[contenteditable]');if(!td)return;
 const t=T[cur],r=t.rows[+td.dataset.i],c=+td.dataset.c,s=td.textContent.trim();
 if(t.nc.includes(c)){const v=s===''?0:pn(s);if(isNaN(v))return;r[c]=v}else r[c]=s;
 t.calc(r);td.parentElement.querySelectorAll('td.calc').forEach(k=>k.textContent=fc(t,+k.dataset.c,r[+k.dataset.c]));drawDash();save()});
$('#tb').addEventListener('focusout',e=>{const td=e.target.closest('td[contenteditable]');if(!td)return;
 const t=T[cur],r=t.rows[+td.dataset.i],c=+td.dataset.c;td.textContent=fc(t,c,r[c])});

/* ---- exportação ---- */
const cell=v=>typeof v==='number'?String(v).replace('.',','):String(v);
const tsv=t=>[t.cols,...t.rows].map(r=>r.map(v=>cell(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
const csv=t=>'\uFEFF'+[t.cols,...t.rows].map(r=>r.map(v=>{const s=cell(v);return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n');
async function copy(txt){try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}
function flash(sel,txt){document.querySelectorAll(sel).forEach(b=>{if(!b.dataset.o)b.dataset.o=b.textContent;b.textContent=txt;b.classList.add('done');clearTimeout(b._t);b._t=setTimeout(()=>{b.textContent=b.dataset.o;b.classList.remove('done')},3000)})}

Chart.register(ChartDataLabels);
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
